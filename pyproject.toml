[project]
name = "hackathon"
version = "1.0.0.dev1"
description = "project that was submitted by me during the AIPS Hackathon at Melbourne University"
readme = "README.md"
authors = [
    { name = "Rohan Prasen Kedari", email = "rohanprasenkedari@gmail.com" },
    { name = "Ashfaaq Hamja Shaik", email = "ashfaaq.hamja786@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "openai>=3.29.0",
    "python-dotenv>=1.2.4",
    "streamlit>=1.65.0",
    "watchdog>=6.0.0",
]

[project.scripts]
hackathon = "hackathon:main"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pre-commit>=4.7.0",
    "pytest>=9.1.1",
    "ruff>=0.17.0",
]
